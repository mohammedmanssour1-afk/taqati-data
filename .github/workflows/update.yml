name: Update prices

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours
  workflow_dispatch:
    inputs:
      backfill:
        description: "Backfill from this date (YYYY-MM-DD). Leave empty for a normal run."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests
        run: python -m unittest discover -s tests -v

      - name: Fetch new prices
        run: |
          if [ -n "${{ github.event.inputs.backfill }}" ]; then
            python -m pipeline.update --backfill "${{ github.event.inputs.backfill }}"
          else
            python -m pipeline.update
          fi

      - name: Commit new data
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name "taqati-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data
            git commit -m "Update prices $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          else
            echo "No new data."
          fi
